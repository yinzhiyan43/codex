<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Codex Workbench — 合成演示</title>
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="history-controls"><button id="back" aria-label="返回"><i class="ph ph-arrow-left" aria-hidden="true"></i></button><button disabled aria-label="前进（后续阶段）"><i class="ph ph-arrow-right" aria-hidden="true"></i></button><button id="toggle-sidebar" aria-label="显示或隐藏项目栏"><i class="ph ph-sidebar" aria-hidden="true"></i></button></div>
    <span id="mode-label" class="demo-badge">合成演示</span>
    <button id="toggle-details" aria-label="显示或隐藏详情"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i></button>
  </header>
  <nav class="rail" aria-label="主导航">
    <button id="home" class="selected" aria-label="工作台"><i class="ph ph-house" aria-hidden="true"></i></button>
    <button disabled title="资源：后续阶段" aria-label="资源（后续阶段）"><i class="ph ph-cards" aria-hidden="true"></i></button>
    <button disabled title="定时任务：后续阶段" aria-label="定时任务（后续阶段）"><i class="ph ph-clock" aria-hidden="true"></i></button>
    <button disabled title="伙伴：后续阶段" aria-label="伙伴（后续阶段）"><i class="ph ph-smiley" aria-hidden="true"></i></button>
    <button disabled aria-label="更多（后续阶段）"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
    <hr>
    <button disabled title="代码审查：后续阶段" aria-label="代码审查（后续阶段）"><i class="ph ph-git-branch" aria-hidden="true"></i></button>
    <button disabled title="插件：后续阶段" aria-label="插件（后续阶段）"><i class="ph ph-squares-four" aria-hidden="true"></i></button>
    <button id="account" class="account-button" aria-label="演示账户菜单"><i class="ph ph-user-circle" aria-hidden="true"></i></button>
  </nav>
  <aside class="sidebar" aria-label="项目和会话">
    <div class="sidebar-heading"><span>Codex</span><i class="ph ph-caret-down" aria-hidden="true"></i><button id="connection-menu" aria-label="连接设置"><i class="ph ph-plugs" aria-hidden="true"></i></button><button id="toggle-search" aria-label="搜索会话"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button></div>
    <label id="search-wrap" class="search-wrap" hidden><span class="sr-only">搜索会话</span><input id="search" maxlength="128" placeholder="搜索演示会话"></label>
    <button id="new" class="sidebar-action"><i class="ph ph-note-pencil" aria-hidden="true"></i>新聊天</button>
    <button id="workspace" class="sidebar-action"><i class="ph ph-circle" aria-hidden="true"></i>本地工作台</button>
    <h2>项目</h2>
    <div id="project-list"></div>
    <div class="recent-label">最近 <i class="ph ph-caret-right" aria-hidden="true"></i></div>
    <section id="account-menu" class="account-menu" hidden><strong>演示账户</strong><span>仅合成内容</span><hr><button id="account-help"><i class="ph ph-info" aria-hidden="true"></i>关于此演示</button><button id="account-close"><i class="ph ph-x" aria-hidden="true"></i>关闭菜单</button></section>
  </aside>
  <main class="main">
    <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="retry">重连</button><button id="dismiss" aria-label="关闭提示"><i class="ph ph-x" aria-hidden="true"></i></button></div>
    <section id="core-status" class="core-status" hidden aria-label="官方核心隔离连接">
    <h2>官方核心连接</h2><p id="core-description">只验证本机进程和只读协议。此环境为空，尚未登录；不发送消息。</p><p id="core-account"></p>
    <p id="core-connection"></p><button id="probe-core" type="button">检查只读接口</button>
    <ul id="core-results"></ul><p id="core-next-step">没有加载既有聊天。模型和账户能力将在获准登录后验证。</p>
  </section>
  <section id="history-toolbar" class="history-toolbar" aria-label="历史分页" hidden><span id="history-count"></span><span id="history-status" role="status"></span><button id="load-history">加载更早历史</button><button id="cancel-history" hidden>取消加载</button></section>
    <section id="approval-list" class="approval-list" aria-label="审批请求" hidden></section>
    <section id="empty" class="empty"><i class="ph ph-terminal-window" aria-hidden="true"></i><h1 id="empty-title"></h1></section>
    <section id="conversation" class="conversation" aria-label="演示会话" hidden><div id="messages" class="messages"></div></section>
    <form id="composer" class="composer">
      <div class="context-strip"><i class="ph ph-folder-open" aria-hidden="true"></i><span id="project-context"></span><i class="ph ph-laptop" aria-hidden="true"></i><span>此计算机</span><span id="connection-label" class="connection-label"></span></div>
      <div class="input-card"><label class="sr-only" for="draft">消息</label><textarea id="draft" maxlength="4000" rows="2" placeholder="随心输入"></textarea><div class="composer-tools"><button type="button" disabled aria-label="添加附件（后续阶段）"><i class="ph ph-plus" aria-hidden="true"></i></button><button type="button" disabled class="approval-mode"><i class="ph ph-shield-check" aria-hidden="true"></i>帮我批准</button><span class="spacer"></span><span class="model-label"><i class="ph ph-lightning" aria-hidden="true"></i><span id="model-text">合成模型</span><i class="ph ph-caret-down" aria-hidden="true"></i></span><button type="button" disabled aria-label="语音（后续阶段）"><i class="ph ph-microphone" aria-hidden="true"></i></button><button id="send" type="submit" class="send" aria-label="确认发送"><i class="ph ph-arrow-up" aria-hidden="true"></i></button><button id="stop" type="button" class="send" aria-label="停止演示" hidden><i class="ph ph-stop" aria-hidden="true"></i></button></div></div>
    </form>
  </main>
  <aside id="details" class="details" aria-label="工作台详情" hidden><div class="detail-heading"><i class="ph ph-user-circle" aria-hidden="true"></i><div><strong>本地工作台</strong><span>合成演示</span></div></div><h2>电脑</h2><div class="computer-row"><i class="ph ph-desktop" aria-hidden="true"></i><div>演示环境<span id="detail-connection"></span></div></div><h2>最近活动</h2><div class="activity"><i class="ph ph-chat-circle" aria-hidden="true"></i>检查导航与会话</div><div class="activity"><i class="ph ph-chat-circle" aria-hidden="true"></i>验证输入和取消</div><h2>输出内容</h2><div class="activity"><i class="ph ph-file-text" aria-hidden="true"></i>工作台阶段说明</div></aside>
</div>
<dialog id="connection-dialog"><form method="dialog"><h2 id="connection-title">演示连接</h2><p id="connection-description">只连接本地合成 peer，不使用真实账户或模型。</p><div class="dialog-actions"><button id="disconnect" type="button">断开</button><button id="reconnect" type="button">重连</button><button id="close-connection">返回</button></div></form></dialog>
<dialog id="confirm-dialog"><h2>发送演示消息？</h2><p id="confirm-text"></p><p class="dialog-caption">只生成本地演示回应。</p><div class="dialog-actions"><button id="cancel-confirm">返回编辑</button><button id="confirm" class="primary">发送</button></div></dialog>
</body>
</html>
