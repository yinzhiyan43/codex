<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><title>Codex Workbench — 只读副窗口</title><script src="theme.js"></script><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="preview.css"><script defer src="preview.js"></script><link rel="stylesheet" href="repository.css"><link rel="stylesheet" href="tool-workflow.css"></head><body><a class="skip-link" href="#messages">跳到保存的会话文字</a><header><span>只读副窗口</span><h1 id="title"></h1></header><div class="toolbar" role="group" aria-label="只读历史操作"><button id="refresh">刷新记录</button><button id="older">加载更早轮次</button><button id="cancel" hidden>取消读取</button></div><p id="state" role="status" aria-atomic="true"></p><p id="notice">取得编辑权后可在此会话编辑和确认发送。关闭此窗口不会停止核心或其他窗口。</p><p id="error" role="alert" hidden></p><section id="tool-workflow" class="tool-workflow" aria-label="工具与待处理请求" hidden></section><details id="repository-panel" class="repository-panel" hidden></details><main id="messages" tabindex="0" aria-label="保存的会话文字"></main><p id="close-status" role="status" hidden></p><section id="editor-controls" aria-label="会话编辑" hidden><p id="editor-status" role="status" aria-atomic="true"></p><p id="editor-model"></p><button id="retry-persistence" type="button">重试持久保存</button><button id="enable-editor" type="button">取得编辑权</button><button id="release-editor" type="button" hidden>保存并释放编辑权</button><button id="retry-draft" type="button">重试保存草稿</button><button id="use-saved-draft" type="button">使用已保存草稿（放弃未保存改动）</button></section><div id="editor-form"></div><dialog id="preview-confirm" aria-labelledby="preview-confirm-title" aria-describedby="preview-pending"><h2 id="preview-confirm-title">发送此会话的消息？</h2><p id="preview-pending"></p><p>仅在本窗口确认后发送；工作台同一时间只执行一个回合。</p><button id="preview-cancel-confirm" type="button">返回编辑</button><button id="preview-confirm-send" type="button">发送</button></dialog></body></html>
